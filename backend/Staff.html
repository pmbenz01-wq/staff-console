<!--
  Staff Console shell — served by Apps Script (doGet → serveStaffConsole_).

  Deliberately thin: the actual UI (staff.css / staff.js) is loaded from the
  Vercel deployment of this repo (docs/ mirrors staff/), so day-to-day UI
  changes are a `git push` and never require re-pasting this file or
  redeploying the web app. Only backend changes (Code.gs) need a redeploy.

  If you redeploy this to a different host, change ASSET_BASE below.
-->
-->
<base target="_top">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@200;300;400;500;600&family=Trirong:wght@200;300;400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  html,body{margin:0;background:#141310;color:#f0ece3;font-family:Anuphan,system-ui,sans-serif}
  #boot-fallback{padding:40px 24px;font:300 13px/1.8 Anuphan,sans-serif;color:#8b8578;max-width:520px}
  #boot-fallback code{font-family:"IBM Plex Mono",monospace;color:#c9ac74}
</style>

<div id="app"></div>

<div id="boot-fallback" hidden>
  <p>โหลดหน้าจอ Staff Console ไม่สำเร็จ — โหลดไฟล์หน้าตาเว็บจาก GitHub Pages ไม่ได้</p>
  <p>ตรวจว่า GitHub Pages ของ repo เปิดอยู่ และเข้าถึงได้จากเครือข่ายนี้:<br>
  <code id="fallback-url"></code></p>
</div>

<script>
  // Where the UI assets live. Must be publicly reachable over https.
  var ASSET_BASE = "https://staff-console-teal.vercel.app/staff";

  (function () {
    var css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = ASSET_BASE + "/staff.css";
    document.head.appendChild(css);

    // Load in order: QR generator, QR reader, then the app itself.
    var files = ["/vendor/qrcode.js", "/vendor/jsQR.js", "/staff.js"];
    var i = 0;
    function next() {
      if (i >= files.length) return;
      var s = document.createElement("script");
      s.src = ASSET_BASE + files[i++];
      s.onload = next;
      s.onerror = function () {
        document.getElementById("fallback-url").textContent = s.src;
        document.getElementById("boot-fallback").hidden = false;
      };
      document.body.appendChild(s);
    }
    next();
  })();
</script>
